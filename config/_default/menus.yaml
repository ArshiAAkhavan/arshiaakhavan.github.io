# Navigation Links
#   To link a homepage widget, specify the URL as a hash `#` followed by the filename of the
#     desired widget in your `content/home/` folder.
#   The weight parameter defines the order that the links will appear in.

main:
  - name: Home
    url: '#about'
    weight: 10
  - name: Honors
    url: '#honors'
    weight: 20
  - name: Publications
    url: '#publications'
    weight: 30
  - name: Industrial Experience
    url: '#industrial-experience'
    weight: 40
  - name: Projects
    url: '#projects'
    weight: 50
  - name: Academic Services
    url: '#academic-services'
    weight: 60
  - name: Service
    url: '#voluntary'
    weight: 70
  - name: Skills
    url: '#programming-languages'
    weight: 80
  - name: Contact
    url: '#contact'
    weight: 90

